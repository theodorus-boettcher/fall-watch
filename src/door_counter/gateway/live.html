<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall watch live</title>
<style>
  :root {
    --bg: #f4f4f1; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --line: #deded8;
    --warn: #c2410c; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1f1f1d; --text: #ececea; --muted: #9b9b95; --line: #33332f;
            --warn: #fb923c; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
         grid-template-columns: minmax(0, 1fr) 280px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 6px; background: #000; }
  .big { font-size: 44px; font-weight: 700; line-height: 1; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0 0; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 0 0; }
  #alert { display: none; background: var(--bad); color: #fff; border-radius: 8px; padding: 10px 12px;
           margin-bottom: 10px; font-weight: 700; align-items: center; justify-content: space-between; gap: 12px; }
  #alert button { font: inherit; font-weight: 600; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  ol { margin: 8px 0 0; padding-left: 20px; }
  li { margin: 2px 0; }
</style>
</head>
<body>
<main>
  <section class="panel">
    <h1>Bedroom: people seen by the phone</h1>
    <div id="alert"><span id="alert-text"></span><button id="clear" type="button">Clear</button></div>
    <canvas id="view" width="640" height="480"></canvas>
    <div class="status" id="status">waiting for the phone...</div>
  </section>
  <aside class="panel">
    <div style="color: var(--muted)">people in view now</div>
    <div class="big" id="items">-</div>
    <dl id="people"></dl>
    <h2>alerts</h2>
    <ol id="alerts"><li>none yet</li></ol>
    <h2>phone</h2>
    <dl>
      <dt>frames per second</dt><dd id="fps">-</dd>
      <dt>model time per frame</dt><dd id="inference">-</dd>
      <dt>CPU temperature</dt><dd id="cpu">-</dd>
      <dt>battery</dt><dd id="battery">-</dd>
      <dt>queued on phone</dt><dd id="queued">-</dd>
      <dt>dropped</dt><dd id="dropped">-</dd>
      <dt>model</dt><dd id="model">-</dd>
      <dt>frame</dt><dd id="frame">-</dd>
      <dt>recording</dt><dd id="capture">-</dd>
    </dl>
  </aside>
</main>
<script>
  const POLL_MS = 150;
  const STALE_S = 3;
  const MIN_VISIBILITY = 0.5;
  // COCO skeleton: pairs of keypoint indices (0 nose, 5/6 shoulders, 11/12 hips, 15/16 ankles).
  const EDGES = [[5, 7], [7, 9], [6, 8], [8, 10], [5, 6], [5, 11], [6, 12], [11, 12], [11, 13], [13, 15],
                 [12, 14], [14, 16], [0, 1], [0, 2], [1, 3], [2, 4]];
  const STANDING = [0, 158, 115], IN_BED = [86, 180, 233], ON_FLOOR = [240, 60, 60], BED = [86, 180, 233];
  const canvas = document.getElementById("view");
  const ctx = canvas.getContext("2d");
  let shownPreviewId = null;
  let loading = false;

  function rgb(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }
  function colour(p) { return !p.is_lying ? STANDING : p.is_in_bed ? IN_BED : ON_FLOOR; }
  function posture(p) {
    return !p.is_lying ? "not lying" : p.is_in_bed ? "lying in bed" : "on the floor " + p.lying_for_s.toFixed(0) + " s";
  }

  function setText(id, text, cls) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = cls || "";
  }

  // Draw the picture rotated upright (clockwise), or a dark room when there is none, then the bed
  // zones and each person's skeleton, box and label (all 0..1 of the upright frame).
  function draw(img, rotationDeg, people, beds, frameW, frameH) {
    if (img) {
      const swapped = rotationDeg === 90 || rotationDeg === 270;
      canvas.width = swapped ? img.height : img.width;
      canvas.height = swapped ? img.width : img.height;
    } else {
      canvas.width = frameW; canvas.height = frameH;
    }
    const w = canvas.width, h = canvas.height;
    if (img) {
      ctx.save();
      if (rotationDeg === 90) { ctx.translate(w, 0); }
      else if (rotationDeg === 180) { ctx.translate(w, h); }
      else if (rotationDeg === 270) { ctx.translate(0, h); }
      ctx.rotate(rotationDeg * Math.PI / 180);
      ctx.drawImage(img, 0, 0);
      ctx.restore();
    } else {
      ctx.fillStyle = "#101010"; ctx.fillRect(0, 0, w, h);
    }
    ctx.font = "bold 15px system-ui, sans-serif";
    ctx.setLineDash([8, 6]); ctx.lineWidth = 2;
    for (const b of beds) {
      ctx.strokeStyle = rgb(BED, 0.9);
      ctx.strokeRect(b.x1 * w, b.y1 * h, (b.x2 - b.x1) * w, (b.y2 - b.y1) * h);
      ctx.fillStyle = rgb(BED, 0.9); ctx.fillText("bed", b.x1 * w + 6, b.y1 * h + 18);
    }
    ctx.setLineDash([]);
    for (const p of people) {
      const c = colour(p), k = p.item.keypoints, b = p.item.box;
      ctx.lineWidth = 4; ctx.strokeStyle = rgb(c, 0.95);
      for (const [i, j] of EDGES) {
        if (k[i].visibility < MIN_VISIBILITY || k[j].visibility < MIN_VISIBILITY) { continue; }
        ctx.beginPath(); ctx.moveTo(k[i].x * w, k[i].y * h); ctx.lineTo(k[j].x * w, k[j].y * h); ctx.stroke();
      }
      ctx.fillStyle = rgb(c, 1);
      for (const pt of k) {
        if (pt.visibility >= MIN_VISIBILITY) { ctx.beginPath(); ctx.arc(pt.x * w, pt.y * h, 3, 0, 2 * Math.PI); ctx.fill(); }
      }
      ctx.lineWidth = 1; ctx.strokeStyle = rgb(c, 0.6);
      ctx.strokeRect(b.x1 * w, b.y1 * h, (b.x2 - b.x1) * w, (b.y2 - b.y1) * h);
      const label = "#" + p.track_id + " " + posture(p);
      const tw = ctx.measureText(label).width + 8, y = b.y1 * h;
      ctx.fillStyle = rgb(c, 0.9); ctx.fillRect(b.x1 * w, Math.max(0, y - 21), tw, 21);
      ctx.fillStyle = "#000"; ctx.fillText(label, b.x1 * w + 4, Math.max(15, y - 6));
    }
  }

  function showPeople(people) {
    const dl = document.getElementById("people");
    dl.replaceChildren();
    for (const p of people) {
      const dt = document.createElement("dt");
      const sw = document.createElement("span");
      sw.className = "swatch"; sw.style.background = rgb(colour(p), 1);
      dt.append(sw, "#" + p.track_id);
      const dd = document.createElement("dd");
      dd.textContent = posture(p);
      dl.append(dt, dd);
    }
  }

  // Alert times are the phone's clock, which may be wrong (no internet time), so show them as "ago".
  function showAlerts(alerts, nowS) {
    const open = alerts.filter(a => a.ended_s === null);
    const box = document.getElementById("alert");
    box.style.display = open.length ? "flex" : "none";
    if (open.length) {
      const a = open[open.length - 1];
      setText("alert-text", "Person #" + a.track_id + " has been lying on the floor for " +
              (nowS - a.lying_since_s).toFixed(0) + " s");
    }
    const ol = document.getElementById("alerts");
    ol.replaceChildren();
    for (const a of alerts.slice(-8).reverse()) {
      const li = document.createElement("li");
      li.textContent = "#" + a.track_id + ", " + (nowS - a.raised_s).toFixed(0) + " s ago" +
                       (a.ended_s === null ? ", still on the floor" : ", up again after " +
                        (a.ended_s - a.lying_since_s).toFixed(0) + " s");
      li.className = a.ended_s === null ? "bad" : "";
      ol.append(li);
    }
    if (!alerts.length) { const li = document.createElement("li"); li.textContent = "none yet"; ol.append(li); }
  }

  document.getElementById("clear").addEventListener("click", () => {
    fetch("/alerts/clear", { method: "POST" });
  });

  async function poll() {
    try {
      const res = await fetch("/api/latest", { cache: "no-store" });
      const s = await res.json();
      const age = s.seconds_since_last_batch;
      if (age === null) {
        setText("status", "waiting for the phone...");
      } else if (age > STALE_S) {
        setText("status", "no data from the phone for " + age.toFixed(0) + " s", "bad");
      } else {
        setText("status", s.preview ? "live, with the camera picture" : "live, stick figures only (no picture leaves the phone)");
      }
      const f = s.latest_frame;
      if (f) {
        setText("items", String(s.people.length));
        setText("frame", "#" + f.frame_id);
        showPeople(s.people);
        showAlerts(s.alerts, f.wall_time_s);
      }
      if (s.model) { setText("model", s.model.replace("models/", "")); }
      if (s.health) {
        const hl = s.health;
        setText("fps", hl.fps.toFixed(1));
        setText("inference", (hl.mean_inference_s * 1000).toFixed(0) + " ms");
        if (hl.cpu_temp_c !== null) {
          setText("cpu", hl.cpu_temp_c.toFixed(0) + " °C", hl.cpu_temp_c >= 80 ? "bad" : hl.cpu_temp_c >= 70 ? "warn" : "");
        }
        setText("battery", hl.battery_level_pct + "%, " + hl.battery_temp_c.toFixed(1) + " °C" +
                (hl.is_charging ? ", charging" : ""), hl.battery_temp_c >= 45 ? "bad" : "");
      }
      setText("queued", String(s.queued_frames), s.queued_frames > 50 ? "warn" : "");
      setText("dropped", String(s.dropped_frames), s.dropped_frames > 0 ? "bad" : "");
      if (s.capture) {
        setText("capture", s.capture.clip ? s.capture.clip + ", " + s.capture.saved + " pictures" : "off",
                s.capture.clip ? "warn" : "");
      }
      if (s.preview && s.preview.frame_id !== shownPreviewId && !loading) {
        loading = true;
        const img = new Image();
        img.onload = () => {
          draw(img, s.preview.rotation_deg, s.preview_people, s.beds, 0, 0);
          shownPreviewId = s.preview.frame_id;
          loading = false;
        };
        img.onerror = () => { loading = false; };
        img.src = "/preview.jpg?f=" + s.preview.frame_id;
      } else if (!s.preview && f) {
        draw(null, 0, s.people, s.beds, f.width_px, f.height_px);
      }
    } catch (e) {
      setText("status", "gateway not reachable", "bad");
    }
    setTimeout(poll, POLL_MS);
  }
  poll();
</script>
</body>
</html>
