plugins {
    id 'com.android.application'
}

// Machine-specific paths (NDK, ncnn build) live in the git-ignored local.properties.
def localProps = new Properties()
def localPropsFile = file('../local.properties')
if (!localPropsFile.isFile()) {
    throw new GradleException('android/local.properties is missing: copy local.properties.example and fill it in')
}
localPropsFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.doorcounter.app'
    compileSdk 34
    ndkPath localProps.getProperty('ndk.path')
    ndkVersion '27.2.12479018'  // r27c, the NDK ncnn was built with

    defaultConfig {
        applicationId 'com.doorcounter.app'
        // Galaxy S5 on stock Android 6.0.1
        minSdk 23
        targetSdk 23
        versionCode 2
        versionName '1.0'
        ndk {
            abiFilters 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments "-Dncnn_DIR=${localProps.getProperty('ncnn.dir')}", '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Release signing: a key kept outside the repo, named in local.properties (release.store,
    // release.store.password, release.key.alias). Without them the release app comes out unsigned.
    if (localProps.getProperty('release.store')) {
        signingConfigs {
            release {
                storeFile file(localProps.getProperty('release.store'))
                storePassword localProps.getProperty('release.store.password')
                keyAlias localProps.getProperty('release.key.alias')
                keyPassword localProps.getProperty('release.store.password')  // PKCS12: one password for both
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }

    lint {
        // Target 23 on purpose: old phones and old Android rules; the app is not for Google Play.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
