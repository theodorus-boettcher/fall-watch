[project]
name = "door-counter"
version = "0.1.0"
description = "Recycling sorting line: a tiny segmentation model on a 2014 Android phone, counting on a laptop gateway."
requires-python = ">=3.12"
dependencies = [
    "ncnn>=1.0.20260526",
    "numpy",
    "roboflow>=1.7.1",
    "supervision>=0.30.9",
    "trackers>=2.6.1",
]

[project.scripts]
door-gateway = "door_counter.gateway.server:main"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "types-pyyaml>=6.0.12.20260906",
]
train = [
    "ultralytics>=8.4.178",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["roboflow", "roboflow.*", "ncnn"]
ignore_missing_imports = true
