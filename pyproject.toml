[project]
name = "fall-watch"
version = "0.1.0"
description = "Fall watch: a tiny pose model on a 2014 Android phone, alerts on a laptop gateway."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "roboflow>=1.7.1",
    "supervision>=0.30.9",
    "trackers>=2.6.1",
]

[project.scripts]
fall-gateway = "fall_watch.gateway.server:main"

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "types-pyyaml>=6.0.12.20260906",
]
train = [
    "ncnn>=1.0.20260526",  # runs the phone's models on the laptop (eval_falls)
    "pnnx",  # ncnn export for the phone
    "ultralytics>=8.4.178",
]
teacher = [
    "rfdetr>=1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# These ship no type information.
module = ["roboflow", "roboflow.*"]
ignore_missing_imports = true
