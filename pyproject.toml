[project]
name = "door-counter"
version = "0.1.0"
description = "Real-time people counter: a tiny detector on a 2014 Android phone, counting on a laptop gateway."
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.scripts]
door-gateway = "door_counter.gateway.server:main"

[dependency-groups]
dev = ["pytest", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
